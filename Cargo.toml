[package]
name = "guise"
version = "0.2.1"
edition = "2021"
description = "Wear a different account's guise on Claude Desktop — instant, local, non-destructive account switching."
license = "MIT"
repository = "https://github.com/siddhjagani/guise"
readme = "README.md"
keywords = ["claude", "anthropic", "macos", "windows", "account-switcher", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "guise"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dialoguer = { version = "0.11", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
junction = { version = "2.1", default-features = false }
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
